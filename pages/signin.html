<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Magazine Platform</title>
  <meta name="description" content="Sign in to your Magazine Platform account to access your dashboard, saved magazines, and exclusive content.">
  <link rel="stylesheet" href="../main.css">
</head>
<body>

  <!-- ═══ HEADER ═══ -->
  <header class="main-header header-inner-page" id="mainHeader">
    <div class="container header-container">
      <a href="../index.html" class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12zM10 9h8v2h-8V9zm0 3h4v2h-4v-2zm0-6h8v2h-8V6z"/></svg>
        </div>
        <div>
          <div class="logo-text">Magazine Platform</div>
          <div class="logo-subtext">Read • Discover • Explore</div>
        </div>
      </a>

      <nav class="main-nav">
        <a href="../index.html">Home</a>
        <a href="../index.html#magazines">Magazines</a>
        <a href="../index.html#about">About</a>
      </nav>

      <div class="header-actions">
        <a href="signup.html" class="btn btn-sm btn-primary">Sign Up</a>
      </div>
    </div>
  </header>

  <!-- ═══ SIGN IN PAGE ═══ -->
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-icon" style="width:56px;height:56px;">
          <svg viewBox="0 0 24 24" fill="currentColor" style="width:32px;height:32px;"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to continue to your dashboard</p>
      </div>

      <div class="auth-body">
        <form class="form" data-validate="true">
          <div class="form-group">
            <label class="form-label form-label-required" for="email">Email Address</label>
            <div class="form-input-wrapper">
              <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" data-validate="email">
            </div>
            <span class="form-error"></span>
          </div>

          <div class="form-group">
            <label class="form-label form-label-required" for="password">Password</label>
            <div class="form-input-wrapper">
              <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" data-validate="password">
            </div>
            <span class="form-error"></span>
          </div>

          <div class="auth-forgot">
            <a href="#">Forgot Password?</a>
          </div>

          <div class="form-checkbox-group">
            <input type="checkbox" id="remember" class="form-checkbox">
            <label for="remember" class="form-checkbox-label">Remember me for 30 days</label>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg">Sign In</button>

          <div class="form-divider">or</div>

          <a href="dashboard.html" class="btn btn-secondary btn-full btn-lg">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Demo: View Dashboard
          </a>
        </form>
      </div>

      <div class="auth-footer">
        <p>Don't have an account? <a href="signup.html">Sign Up Free</a></p>
      </div>
    </div>
  </div>

  <script type="module" src="../app.js"></script>
</body>
</html>
