# ═══════════════════════════════════════════════════════════════
# security-headers.conf — Nginx Security Headers
# Protects against XSS, clickjacking, MIME sniffing, and more.
# ═══════════════════════════════════════════════════════════════

# ─── Prevent Clickjacking ───
# Blocks the site from being embedded in iframes on other domains
add_header X-Frame-Options "SAMEORIGIN" always;

# ─── Prevent MIME-Type Sniffing ───
# Stops browsers from interpreting files as a different MIME type
add_header X-Content-Type-Options "nosniff" always;

# ─── XSS Protection ───
# Legacy XSS filter — modern CSP is primary defense, but this helps older browsers
add_header X-XSS-Protection "1; mode=block" always;

# ─── Content Security Policy ───
# Whitelist-based policy controlling which resources the browser can load
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

# ─── Referrer Policy ───
# Controls how much referrer information is sent with requests
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ─── Permissions Policy ───
# Restricts access to browser features (camera, mic, geolocation, etc.)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

# ─── HTTP Strict Transport Security (HSTS) ───
# Forces HTTPS for 1 year including subdomains (enable in production with SSL)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# ─── Cross-Origin Policies ───
# Prevents cross-origin information leaks
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;

# ─── Cache Control for sensitive pages ───
# Prevents caching of authenticated pages
add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
add_header Pragma "no-cache" always;
