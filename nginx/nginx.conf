# ═══════════════════════════════════════════════════════════════
# nginx.conf — Production-Hardened Nginx Configuration
# Static file serving with security headers, rate limiting,
# gzip compression, and caching.
# ═══════════════════════════════════════════════════════════════

worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ───
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ─── Performance ───
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ─── Hide Nginx Version (Security) ───
    server_tokens off;

    # ─── Rate Limiting ───
    # Prevents brute-force and DDoS attacks
    # Zone: 10MB shared memory, 10 requests/second per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    # Stricter limit for auth pages (2 requests/second)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

    # ─── Connection Limiting ───
    # Max 50 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ─── Request Size Limiting ───
    # Prevents large payload attacks
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ─── Gzip Compression ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # ─── Connection Limit ───
        limit_conn addr 50;

        # ─── Security Headers ───
        include /etc/nginx/conf.d/security-headers.conf;

        # ─── General Rate Limit ───
        # Allow burst of 20 requests, delay after 10
        limit_req zone=general burst=20 delay=10;

        # ─── Static File Caching ───
        # Cache images, fonts, CSS, JS for 1 year
        location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~* \.(css|js)$ {
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # ─── Auth Pages: Stricter Rate Limit ───
        location ~* ^/pages/(signin|signup)\.html$ {
            limit_req zone=auth burst=5 nodelay;
            try_files $uri =404;
        }

        # ─── Block Sensitive Files ───
        # Prevent access to hidden files, backups, and config
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(bak|config|sql|fla|psd|ini|log|sh|bat|inc|swp|dist|md)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ─── Block Directory Listing ───
        autoindex off;

        # ─── Block Access to Data/Docs ───
        location /data/ {
            deny all;
            return 403;
        }

        location /docs/ {
            deny all;
            return 403;
        }

        location /nginx/ {
            deny all;
            return 403;
        }

        location /scripts/ {
            deny all;
            return 403;
        }

        # ─── SPA Fallback ───
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ─── Custom Error Pages ───
        error_page 403 /index.html;
        error_page 404 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}
