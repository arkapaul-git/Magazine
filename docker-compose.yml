# ═══════════════════════════════════════════════════════════════
# docker-compose.yml — Magazine Platform
# Single service: Nginx serving the static frontend.
# ═══════════════════════════════════════════════════════════════

services:
  magazine-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: magazine-platform
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # ── Security: Read-only filesystem ──
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/log/nginx
    # ── Security: Drop all capabilities, add only what's needed ──
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    # ── Security: No privilege escalation ──
    security_opt:
      - no-new-privileges:true
    # ── Resource Limits ──
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M
    # ── Logging ──
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - magazine-net

networks:
  magazine-net:
    driver: bridge
